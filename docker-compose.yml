services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ted
      POSTGRES_PASSWORD: ted
      POSTGRES_DB: ted_backend
    ports:
      - "5432:5432"
    volumes:
      - ted_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ted -d ted_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ted_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura correos salientes en desarrollo/pruebas (RF-213, módulo
  # speakers) -- sin esto, MailService no tendría nada real contra qué
  # probar y el proyecto tendría que mockear su primera pieza de
  # infraestructura, algo que el Artículo IX prohíbe. Sin healthcheck: no
  # bloquea el arranque de la app como sí lo hacen postgres/redis.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP, sin autenticación
      - "8025:8025" # API REST + UI: GET /api/v1/messages

volumes:
  ted_postgres_data:
  ted_redis_data:

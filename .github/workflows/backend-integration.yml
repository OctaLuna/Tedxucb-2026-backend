name: Backend integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma.config.ts'
      - 'docker-compose.test.yml'
      - '.github/workflows/backend-integration.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma.config.ts'
      - 'docker-compose.test.yml'
      - '.github/workflows/backend-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: PostgreSQL and Redis contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://ted_test:local_test_only@127.0.0.1:55432/ted_integration_test?schema=public
      DIRECT_URL: postgresql://ted_test:local_test_only@127.0.0.1:55432/ted_integration_test?schema=public
      REDIS_URL: redis://127.0.0.1:56379
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-deployment-20261029
      QR_TOKEN_SECRET: ci-only-qr-secret-not-for-deployment-20261029
      AVATAR_BRIDGE_SECRET: ci-only-avatar-secret-not-for-deployment-20261029
      GOOGLE_CLIENT_ID: backend-test-client.apps.googleusercontent.com
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      PUBLIC_FRONTEND_URL_TEDX: http://localhost:3000
      PUBLIC_FRONTEND_URL_INNOVATION_WEEK: http://localhost:5173
      SMTP_HOST: localhost
      SMTP_PORT: 1025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated test services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Apply migrations to the isolated integration database
        run: npm run migrate:local

      - name: Run backend unit and contract suites
        run: npm run test:local -- --maxWorkers=1 --testTimeout=120000

      - name: Create isolated migration-fixture database
        run: docker compose -f docker-compose.test.yml exec -T postgres-test createdb -U ted_test ted_backend_local

      - name: Verify event-scope migrations with sanitized fixtures
        run: npm run test:migrations:local

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down
